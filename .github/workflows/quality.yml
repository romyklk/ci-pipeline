name: Qualité du code
on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - develop
jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@v7
            - name: Récupérer le cache Composer
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                php-version: '8.5'
                extensions: mbstring, intl

            - name: Mise en cache du Composer
              uses: actions/cache@v6
              with:
                path: ${{ steps.composer-cache.outputs.dir }}
                key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                restore-keys: ${{ runner.os }}-composer-

            - name: Installer les dépendances Composer
              run: composer install --no-progress --no-interaction --prefer-dist


            - name: Vérification du style avec php cs-fixer
              run: vendor/bin/php-cs-fixer fix --dry-run --diff

            - name: Analyse statique avec PHPStan
              run: vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress

            - name: Linter Twig
              run: bin/console lint:twig templates/

            - name: Linter YAML
              run: bin/console lint:yaml config/

            - name: Linter les containers de services
              run: bin/console lint:container --no-debug
            - name: Vérification des entités Doctrine
              run: bin/console doctrine:schema:validate --skip-sync -vvv --no-interaction

    test:
        runs-on: ubuntu-latest
        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@v7
            - name: Récupérer le cache Composer
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                php-version: '8.5'
                extensions: mbstring, intl

            - name: Mise en cache du Composer
              uses: actions/cache@v6
              with:
                path: ${{ steps.composer-cache.outputs.dir }}
                key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                restore-keys: ${{ runner.os }}-composer-

            - name: Installer les dépendances Composer
              run: composer install --no-progress --no-interaction --prefer-dist


            - name: Exécuter les tests PHPUnit
              run: php bin/phpunit --log-junit phpunit-report.xml

    test-integration:
        needs: [quality, test]
        runs-on: ubuntu-latest
        services:
          mysql:
              image: mysql:8.0
              env:
                MYSQL_ROOT_PASSWORD: testpass
                MYSQL_DATABASE: testdb_test
              ports:
                - 3306:3306
              options: >-
                --health-cmd="mysqladmin ping --silent"
                --health-interval=10s
                --health-timeout=5s
                --health-retries=3
        env:
            DATABASE_URL: mysql://root:testpass@127.0.0.1:3306/testdb
            APP_ENV: test
        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@v7
            - name: Récupérer le cache Composer
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                php-version: '8.5'
                extensions: mbstring, intl

            - name: Mise en cache du Composer
              uses: actions/cache@v6
              with:
                path: ${{ steps.composer-cache.outputs.dir }}
                key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                restore-keys: ${{ runner.os }}-composer-

            - name: Installer les dépendances Composer
              run: composer install --no-progress --no-interaction --prefer-dist

            - name: Créer la base de données
              run: |
                  php bin/console doctrine:database:create --no-interaction --if-not-exists
                  php bin/console doctrine:schema:create --no-interaction

            - name: Charger les fixtures
              run: php bin/console doctrine:fixtures:load --no-interaction

            - name: Exécuter les tests d'intégration
              run: php bin/phpunit
    build-push:
        needs: [test-integration]
        runs-on: ubuntu-latest
        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@v7
            - name: Login au compte Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Construire et pousser l'image Docker
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/sym-demo-ci-b3:latest

    deploy:
        needs: [test-integration]
        runs-on: ubuntu-latest
        continue-on-error: false
        steps:
            - name: Récupérer le dépôt
              uses: actions/checkout@v7
            - name: Déployer l'application
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.SSH_HOST }}
                username: ${{ secrets.SSH_USER }}
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                port: ${{ secrets.SSH_PORT }}
                script: |
                    if [ -d ~/app/.git ]; then
                        cd ~/app
                        git pull
                    else
                        git clone ${{github.server_url}}/${{github.repository}}.git ~/app
                    fi
